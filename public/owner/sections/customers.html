<section id="customers" class="ops-page">
  <div class="ops-tabs" id="customerTabs">
    <button type="button" data-tab="customers" class="on">Customers</button>
    <button type="button" data-tab="complaints">Complaints <span id="complaintTabCount" class="ops-count hidden">0</span></button>
  </div>

  <div id="customerWorkspace">
    <div class="ops-kpis ops-kpis-3">
      <article class="ops-kpi blue"><span class="ops-kpi-ico">◎</span><div><small>Total Customers</small><b id="custKpiTotal">0</b></div></article>
      <article class="ops-kpi green"><span class="ops-kpi-ico">↻</span><div><small>Returning Customers</small><b id="custKpiReturning">0</b><em id="custKpiReturningPct"></em></div></article>
      <article class="ops-kpi peach"><span class="ops-kpi-ico">＋</span><div><small>New Customers</small><b id="custKpiNew">0</b><em id="custKpiNewPct"></em></div></article>
    </div>
    <article class="card ops-card">
      <header class="ops-card-head">
        <div><h2>Customer Records</h2></div>
        <div class="ops-inline">
          <input id="custSearch" placeholder="Search by name, phone or email...">
          <select id="custSegment"><option value="">All Customers</option><option value="returning">Returning</option><option value="new">New</option></select>
          <button class="btn" type="button" onclick="openCustomerForm()">+ Add Customer</button>
        </div>
      </header>
      <div class="scroll">
        <table class="ops-table">
          <thead><tr><th>Name</th><th>Phone</th><th>Visits</th><th>Total Spend</th><th>Last Visit</th><th></th></tr></thead>
          <tbody id="customerBody"></tbody>
        </table>
      </div>
    </article>
  </div>

  <div id="complaintWorkspace" class="hidden">
    <article class="card ops-card">
      <header class="ops-card-head">
        <div><h2>Complaints</h2><p id="complaintOpenLabel">0 open</p></div>
        <div class="ops-inline">
          <input id="complaintSearch" placeholder="Search complaints...">
          <select id="complaintStatusFilter"><option value="">All statuses</option><option value="open">Open</option><option value="followup">In Progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select>
          <button class="btn" type="button" onclick="openComplaintForm()">+ Add Complaint</button>
        </div>
      </header>
      <div class="scroll">
        <table class="ops-table">
          <thead><tr><th>Date</th><th>Customer</th><th>Priority</th><th>Status</th><th>Complaint</th><th>Resolution</th><th></th></tr></thead>
          <tbody id="complaintBody"></tbody>
        </table>
      </div>
    </article>
  </div>
  <button id="addCustomer" class="ops-offscreen" type="button">Add</button>
</section>
