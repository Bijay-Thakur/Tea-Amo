<section id="dayclose" class="ops-page">
  <div id="dayWorkNotice"></div>
  <div class="ops-split">
    <article class="card ops-card">
      <header class="ops-card-head">
        <div>
          <h2>Day Control</h2>
          <p>Manage today’s business day and POS status.</p>
        </div>
      </header>
      <div id="dayControl" class="ops-status"></div>

      <div class="ops-block">
        <h3>Opening Cash</h3>
        <p>Cash in the drawer at the start of the day.</p>
        <div id="openingCashView"></div>
        <input id="openingCash" class="ops-offscreen" tabindex="-1" aria-hidden="true">
        <button id="saveOpeningCash" class="ops-offscreen" type="button" onclick="saveOpeningCashNow()">Save</button>
      </div>

      <div class="ops-block">
        <h3>POS Control</h3>
        <p>Close POS to stop new orders.</p>
        <div class="ops-inline" id="posControlRow">
          <label class="ops-field ops-pass">Owner password
            <input id="closePassword" type="password" placeholder="Owner password" autocomplete="current-password">
          </label>
          <div id="posAction"></div>
        </div>
      </div>

      <div class="ops-block ops-finalize">
        <h3>Finalize Day</h3>
        <p>Record the counted cash and lock the day.</p>
        <div class="ops-inline">
          <label class="ops-field">Actual cash counted
            <input id="actualCash" type="number" min="0" step="0.01" placeholder="0">
          </label>
          <label class="ops-field ops-grow">Closing note
            <input id="closeNote" placeholder="Optional">
          </label>
          <label class="ops-field">Owner password
            <input id="finalizePassword" type="password" placeholder="Owner password" autocomplete="current-password">
          </label>
          <button class="btn danger" id="finalizeDay" type="button" onclick="finalizeBusinessDay()">Finalize Day</button>
        </div>
        <div id="cashDiff"></div>
      </div>
    </article>

    <article class="card ops-card">
      <header class="ops-card-head">
        <div>
          <h2>Today’s Summary</h2>
          <p>Live Z-report from POS.</p>
        </div>
      </header>
      <div id="zLive"></div>
      <div class="ops-inline ops-actions">
        <button class="btn" id="printZ" type="button">Print Z-Report</button>
        <button class="btn alt" id="exportZ" type="button">Export CSV</button>
      </div>
    </article>
  </div>
</section>
