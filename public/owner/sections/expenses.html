<section id="expenses"><div class="grid g2"><div class="card"><h2>Add Expense</h2><div class="toolbar"><input id="expenseDate" type="date"><select id="expenseCategory"><option>Rent</option><option>Utilities</option><option>Gas</option><option>Internet</option><option>Maintenance</option><option>Marketing</option><option>Packaging</option><option>Cleaning</option><option>Transport</option><option>License / fee</option><option>Other</option></select><input id="expenseVendor" placeholder="Vendor / payee"><select id="expensePayment"><option>Cash</option><option>eSewa</option><option>Khalti</option><option>Fonepay</option><option>Card</option><option>Bank</option></select><input id="expenseAmount" type="number" min="0" step=".01" placeholder="Amount"><input id="expenseRef" placeholder="Reference"><textarea id="expenseNote" placeholder="Notes"></textarea><button class="btn" id="addExpense" onclick="fallbackAddExpense()">Save</button></div></div><div class="card"><h2>Month Summary</h2><div id="expenseSummary"></div></div></div><div class="card" style="margin-top:14px"><div class="scroll"><table><thead><tr><th>Date</th><th>Category</th><th>Vendor</th><th>Payment</th><th>Amount</th><th>Notes</th></tr></thead><tbody id="expenseBody"></tbody></table></div></div></section>
